<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotted I LO Wodzisław Śląski</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="top">
    <!-- TODO: podmień href na docelowy link do Instagrama -->
    <a href="#" class="ig-btn" id="instagram-link" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
        <circle cx="12" cy="12" r="4.2"></circle>
        <circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"></circle>
      </svg>
    </a>
    <img src="jedynkalogo.png" alt="Spotted I LO Wodzisław Śląski" class="site-logo">
    <p>Anonimowe Spotted</p>
    <p>Chcesz usunąć wpis o sobie? napisz na instagram: space.d3v</p>
  </header>

  <main>
    <div class="layout-grid">
      <div class="corkboard">
        <div class="board-toolbar">
          <span class="board-toolbar-label">Sortuj:</span>
          <div class="sort-toggle" role="group" aria-label="Sortowanie wpisów">
            <button type="button" class="sort-btn active" data-sort="new">Najnowsze</button>
            <button type="button" class="sort-btn" data-sort="old">Najstarsze</button>
          </div>
        </div>
        <section id="feed" class="board"></section>
      </div>
      <aside id="compose-host" class="compose-sidebar"></aside>
    </div>
  </main>

  <nav class="foot-nav">
    <a href="regulamin.html">Regulamin</a>
    <a href="changelog.html">Changelog</a>

  <script src="config.js"></script>
  <script src="app.js"></script>

</html>
